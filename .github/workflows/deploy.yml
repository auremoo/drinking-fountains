# Builds the Vite app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings → Pages → "Build and deployment" →
# Source = "GitHub Actions". (The configure-pages step below also enables it
# automatically the first time this workflow runs.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual runs from the Actions tab

# Permissions required by the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Keep this in step with `engines.node` in package.json. CI running an
          # older Node than development is how a dependency that could not even
          # load in CI got merged: the tests it powered were skipped, not failed.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail the deployment before it ships rather than after: the unit tests
      # cover the search policy and the data services, i.e. the parts whose
      # regressions are only visible to users, in the street, at the worst time.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
